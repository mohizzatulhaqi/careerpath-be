[package]
name = "career-path-be"
version = "0.1.0"
edition = "2021"
default-run = "career-path-be"

[[bin]]
name = "career-path-be"
path = "src/main.rs"

[[bin]]
name = "gen_password_hash"
path = "src/bin/gen_password_hash.rs"

[[bin]]
name = "preview_certificate"
path = "src/bin/preview_certificate.rs"

[lib]
name = "career_path_be"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "macros",
] }

jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["password-hash"] }

validator = { version = "0.18", features = ["derive"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

async-trait = "0.1"

dotenvy = "0.15"

utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "preserve_order"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

infer = "0.16"
bytes = "1"
ammonia = "4"

percent-encoding = "2"

# Certificate feature
printpdf = { version = "0.7", features = ["embedded_images"] }  # PDF generation with image embedding
qrcode = "0.14"          # QR code generation
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
base64 = "0.22"

[profile.release]
strip = true        # strip debug symbols → smaller binary
lto = true          # link-time optimization
opt-level = 3
codegen-units = 1   # better optimization, slower build

[dev-dependencies]
tempfile = "3"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
] }
