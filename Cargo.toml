[package]
name = "career-path-be"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "career-path-be"
path = "src/main.rs"

[[bin]]
name = "gen_password_hash"
path = "src/bin/gen_password_hash.rs"

[lib]
name = "career_path_be"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "macros",
] }

jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["password-hash"] }

validator = { version = "0.18", features = ["derive"] }

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

async-trait = "0.1"

dotenvy = "0.15"

infer = "0.16"
bytes = "1"
ammonia = "4"

percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
] }
