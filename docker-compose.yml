version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: career-path-be:latest
    container_name: career_path_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-604800}
      SERVER_PORT: ${SERVER_PORT:-3002}
      STORAGE_ROOT: /app/storage
      RUST_LOG: ${RUST_LOG:-info,career_path_be=info}
    volumes:
      - app_storage:/app/storage
    ports:
      - "${APP_HOST_PORT:-3002}:3002"
    networks:
      - career_path_net

volumes:
  app_storage:

networks:
  career_path_net:
    driver: bridge
